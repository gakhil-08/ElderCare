steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eldercare:$COMMIT_SHA", "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eldercare:$COMMIT_SHA"
substitutions:
  _REGION: asia-south1
  _REPOSITORY: eldercare-images
options:
  logging: CLOUD_LOGGING_ONLY
